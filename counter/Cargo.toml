[package]
name = "culverin-counter"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
tokei = { version = "=15.0.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
encoding_rs = "0.8"
